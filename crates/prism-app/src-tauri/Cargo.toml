[package]
name = "prism-app"
version = "0.2.0"
description = "Prism — Cross-Platform Multimodal Search, Semantic-Space ASR & Part-of-File Verification App"
authors = ["Rabimba Karanjai"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prism-llama = { path = "../../prism-llama" }
prism-asr = { path = "../../prism-asr" }
prism-core = { path = "../../prism-core" }
anyhow = "1.0"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
