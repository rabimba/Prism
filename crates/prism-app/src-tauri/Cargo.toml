[package]
name = "prism-app"
version = "0.2.0"
description = "Prism — Cross-Platform Multimodal Search, Semantic-Space ASR & Part-of-File Verification App"
authors = ["Rabimba Karanjai"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prism-llama = { path = "../../prism-llama" }
prism-asr = { path = "../../prism-asr" }
prism-core = { path = "../../prism-core" }
anyhow = { workspace = true }
dirs = { workspace = true }
image = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
