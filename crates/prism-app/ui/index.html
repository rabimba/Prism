<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism — Multimodal Search, Semantic ASR & Containment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="prism-logo"></div>
        <div>
          <h1>Prism</h1>
          <span class="subtitle">EmbeddingGemma 2 · 768-D Multimodal Search, Semantic ASR &amp; Part-of-File Verifier</span>
        </div>
      </div>

      <div class="folder-controls">
        <input id="folderInput" type="text" placeholder="/path/to/indexed/folder" value="." />
        <button id="indexBtn" class="btn primary">Index Folder</button>
      </div>
    </header>

    <section class="search-panel">
      <div class="search-bar-row">
        <input id="queryInput" type="text" placeholder="Search by meaning, words, code, or speak / drop any file..." />
        <select id="modeSelect">
          <option value="hybrid">Hybrid (768-D + FTS5)</option>
          <option value="semantic">Semantic (768-D)</option>
          <option value="lexical">Lexical (FTS5)</option>
        </select>
        <button id="searchBtn" class="btn primary">Search</button>
        <button id="voiceBtn" class="btn accent" title="Speak a query (768-D Semantic-Space ASR)">🎙️ Voice Search</button>
        <button id="containBtn" class="btn secondary" title="Check if an Image, Video, Audio, or Text is part of indexed files">🔍 Part-of-File Check</button>
      </div>

      <div id="containModal" class="contain-box hidden">
        <div class="contain-row">
          <input id="containFileInput" type="text" placeholder="Path to Image, Video, Audio, PDF, or Code file (or enter text below)..." />
          <button id="runContainFileBtn" class="btn accent">Verify File Containment</button>
        </div>
        <div class="contain-row">
          <textarea id="containTextInput" rows="2" placeholder="Or paste any text passage / code snippet to verify exact containment in indexed files..."></textarea>
          <button id="runContainTextBtn" class="btn secondary">Verify Text Containment</button>
        </div>
      </div>

      <div id="asrBanner" class="asr-banner hidden"></div>
    </section>

    <main id="resultsContainer" class="results-grid"></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
