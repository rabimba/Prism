[workspace]
resolver = "2"
members = [
    "crates/prism-llama",
    "crates/prism-asr",
    "crates/prism-core",
    "crates/prism-cli",
    "crates/prism-app/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Rabimba Karanjai"]
repository = "https://github.com/rabimba/Prism"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
half = { version = "2.4", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.19", features = ["derive"] }
memmap2 = "0.9"
rayon = "1.10"
walkdir = "2.5"
ignore = "0.4"
unicode-normalization = "0.1"
regex = "1.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "pnm"] }
kamadak-exif = "0.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
tempfile = "3.13"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
libloading = "0.8"
ureq = { version = "2.10", features = ["tls"] }
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hound = "3.5"
globset = "0.4"
once_cell = "1.20"
parking_lot = "0.12"
